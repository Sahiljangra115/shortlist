<!DOCTYPE html>
<html>
<body>
<script src="https://cdn.jsdelivr.net/npm/@lemma-work/client/dist/browser/lemma-client.js"></script>
<script>
async function run() {
  try {
    const client = new window.LemmaClient.LemmaClient();
    const state = await client.initialize();
    console.log("State:", state);
    const result = await client.agents.run("matcher", "test message");
    console.log("Result:", result);
    document.body.innerHTML = "Success";
  } catch (e) {
    console.log("Error:", e);
    document.body.innerHTML = "Error: " + e.message;
  }
}
run();
</script>
</body>
</html>
