<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shortlist — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <video class="auth-video" autoplay muted loop playsinline
      data-hls="https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8"></video>
    <div class="auth-overlay"></div>

    <a class="auth-back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back
    </a>

    <div class="auth-card liquid-glass fade-up">
      <div class="auth-head">
        <div class="logo-mark"><div class="logo-outer"></div><div class="logo-inner"></div></div>
        <h1>Welcome <span class="serif">back</span></h1>
        <p>Sign in to your Shortlist workspace.</p>
      </div>

      <div class="auth-err" id="auth-err"></div>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="auth-row">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="btn-primary btn-full" type="submit">Sign in</button>
      </form>

      <div class="auth-divider">or</div>
      <button class="auth-oauth liquid-glass" type="button" id="oauth-btn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 14a8 8 0 0 1-6-2.7c0-2 4-3.1 6-3.1s6 1.1 6 3.1A8 8 0 0 1 12 20z"/></svg>
        Continue with Lemma
      </button>

      <p class="auth-foot">New to Shortlist? <a href="#" id="get-started-link">Get started</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/lemma-integration.js"></script>
</body>
</html>
